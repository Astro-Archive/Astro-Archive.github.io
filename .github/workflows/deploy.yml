name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Resolve site URL
        # El org site (Astro-Archive.github.io) se sirve en la raíz del dominio.
        # Cualquier otro repo es un project site y cuelga de /<repo>/.
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [ "${repo,,}" = "astro-archive.github.io" ]; then
            echo "SITE_URL=https://astroarchive.earth/" >> "$GITHUB_ENV"
          else
            echo "SITE_URL=https://astroarchive.earth/${repo}/" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          SITE_URL: ${{ env.SITE_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
